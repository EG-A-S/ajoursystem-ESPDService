name: Docker Build and Deploy on Tag Push

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if commit is on ajoursystem-customizations branch
        run: |
          git fetch origin ajoursystem-customizations
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/ajoursystem-customizations; then
            echo "Commit is not on ajoursystem-customizations branch. Skipping..."
            exit 0
          fi

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ajoursystem.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ajoursystem.azurecr.io/ajour/espd:${{ env.TAG }}
